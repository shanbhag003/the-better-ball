name: Deploy to Azure

# Runs the CI suite, then ships the API to Azure Container Apps and the web app to
# Azure Static Web Apps. Azure sign-in uses OpenID Connect (no stored passwords).
#
# Repository secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#                       AZURE_STATIC_WEB_APPS_API_TOKEN
# Repository variables: AZURE_RESOURCE_GROUP, ACR_NAME, CONTAINER_APP_NAME, API_URL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  api:
    name: API -> Container Apps
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Built on the runner and pushed: ACR cloud builds are not available on trial subscriptions.
      - name: Build and push image to Azure Container Registry
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/betterball-api"
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -f service/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
      - name: Roll out new revision
        run: |
          az containerapp update -n "${{ vars.CONTAINER_APP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/betterball-api:${{ github.sha }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS "${{ vars.API_URL }}/api/health" && exit 0
            sleep 10
          done
          exit 1

  web:
    name: Web -> Static Web Apps
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
